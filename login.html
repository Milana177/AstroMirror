<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>Вход</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="display:flex; justify-content:center; align-items:center; min-height:100vh;">
        <div class="modal-content" style="max-width:450px; width:100%;">
            <h2>🌙 Вход</h2>
            <div class="form-group"><label>Email</label><input type="email" id="logEmail"></div>
            <div class="form-group"><label>Пароль</label><input type="password" id="logPass"></div>
            <button class="btn" onclick="handleLogin()">Войти</button>
            <div class="modal-link"><a href="register.html">Нет аккаунта? Регистрация</a></div>
        </div>
    </div>
    <script>
        async function handleLogin() {
            const email = document.getElementById('logEmail').value;
            const password = document.getElementById('logPass').value;
            try {
                const res = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                localStorage.setItem('astroToken', data.token);
                window.location.href = 'profile.html';
            } catch (err) { alert(err.message); }
        }
        if(localStorage.getItem('astroToken')) window.location.href = 'profile.html';
    </script>
</body>
</html>
